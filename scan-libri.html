<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scan Libri</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --white: #ffffff;
  --off: #f7f6f4;
  --ink: #111110;
  --mid: #888884;
  --light: #e8e7e4;
  --red: #e5341a;
  --red-soft: #fdf0ed;
  --green: #1a7a4a;
  --green-soft: #edf7f2;
  --blue: #1a4fa0;
  --blue-soft: #edf2fd;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Geist', sans-serif; background: var(--off); color: var(--ink); overscroll-behavior: none; }

#root { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--white); }
#topbar { padding: 20px 24px 0; flex-shrink: 0; }
.wordmark { display: flex; align-items: baseline; gap: 8px; }
.wordmark h1 { font-family: 'Instrument Serif', serif; font-size: 1.7rem; font-weight: 400; letter-spacing: -0.02em; }
.wordmark .badge { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px 20px; border: none; border-radius: var(--radius-sm); font-family: 'Geist', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; -webkit-appearance: none; }
.btn:active { transform: scale(0.98); opacity: 0.85; }
.btn-primary { background: var(--ink); color: var(--white); }
.btn-ghost { background: var(--off); color: var(--ink); }
.btn-danger { background: var(--red-soft); color: var(--red); }
.btn-sm { padding: 10px 16px; font-size: 0.82rem; }

/* AUTH */
#auth-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; }
.auth-hero { text-align: center; margin-bottom: 40px; }
.auth-hero .big-icon { font-size: 4rem; display: block; margin-bottom: 16px; }
.auth-hero h2 { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-weight: 400; margin-bottom: 10px; }
.auth-hero p { font-size: 0.9rem; color: var(--mid); line-height: 1.6; max-width: 280px; margin: 0 auto; }

/* APP */
#app-root { display: none; flex-direction: column; flex: 1; overflow: hidden; }

/* STATUS */
#status-bar { display: none; margin: 10px 24px 0; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.82rem; line-height: 1.4; flex-shrink: 0; }
#status-bar.success { display: block; background: var(--green-soft); color: var(--green); }
#status-bar.error   { display: block; background: var(--red-soft); color: var(--red); }
#status-bar.loading { display: flex; align-items: center; gap: 8px; background: var(--off); color: var(--mid); }
.spinner { width: 14px; height: 14px; border: 2px solid var(--light); border-top-color: var(--mid); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* SCROLL */
#scroll-area { flex: 1; overflow-y: auto; padding: 16px 24px 24px; -webkit-overflow-scrolling: touch; }

/* SCANNER */
#reader { border-radius: var(--radius); overflow: hidden; width: 100% !important; }
#reader video { border-radius: var(--radius) !important; }
#reader img { display: none !important; }
#reader__dashboard { display: none !important; }

.scan-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.manual-row { display: none; gap: 10px; margin-top: 10px; }
.manual-row.visible { display: flex; }
.isbn-input { flex: 1; padding: 13px 16px; border: 1.5px solid var(--light); border-radius: var(--radius-sm); font-family: 'Geist', monospace; font-size: 0.9rem; color: var(--ink); background: var(--white); outline: none; }
.isbn-input:focus { border-color: var(--ink); }

/* SUGGESTION */
#suggestion-banner { display: none; background: var(--blue-soft); border-radius: var(--radius-sm); padding: 14px 16px; margin-top: 14px; }
#suggestion-banner.visible { display: block; }
.suggestion-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
.suggestion-dest { font-size: 1rem; color: var(--ink); font-weight: 500; margin-bottom: 12px; }
.suggestion-actions { display: flex; gap: 8px; }
.sug-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: none; font-family: 'Geist', sans-serif; font-size: 0.82rem; font-weight: 500; cursor: pointer; }
.sug-confirm { background: var(--blue); color: white; }
.sug-change { background: var(--white); color: var(--ink); border: 1.5px solid var(--light) !important; }

/* DEST PICKER */
#dest-picker { display: none; background: var(--off); border-radius: var(--radius); padding: 16px; margin-top: 14px; }
#dest-picker.visible { display: block; }
.dest-title { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mid); margin-bottom: 10px; }
.dest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dest-btn { padding: 11px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--light); background: var(--white); font-family: 'Geist', sans-serif; font-size: 0.78rem; font-weight: 500; color: var(--ink); cursor: pointer; text-align: left; transition: all 0.15s; }
.dest-btn.active { border-color: var(--ink); background: var(--ink); color: var(--white); }
#tab-picker { display: none; margin-top: 12px; }
#tab-picker.visible { display: block; }
.tab-picker-label { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mid); margin-bottom: 8px; }
.tab-btns { display: flex; gap: 8px; }
.tab-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--light); background: var(--white); font-family: 'Geist', sans-serif; font-size: 0.82rem; font-weight: 500; color: var(--mid); cursor: pointer; text-align: center; transition: all 0.15s; }
.tab-btn.active { border-color: var(--ink); background: var(--ink); color: var(--white); }

/* BOOK CARD */
#book-card { display: none; background: var(--off); border-radius: var(--radius); padding: 20px; margin-top: 14px; }
.book-card-title { font-family: 'Instrument Serif', serif; font-size: 1.2rem; font-weight: 400; margin-bottom: 16px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--light); border-radius: var(--radius-sm);
  font-family: 'Geist', sans-serif; font-size: 0.9rem;
  color: var(--ink); background: var(--white); outline: none;
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus { border-color: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* EDITORE PICKER */
.editore-wrap { position: relative; }
.editore-search {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--light); border-radius: var(--radius-sm);
  font-family: 'Geist', sans-serif; font-size: 0.9rem;
  color: var(--ink); background: var(--white); outline: none;
}
.editore-search:focus { border-color: var(--ink); }
.editore-dropdown {
  display: none;
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--white); border: 1.5px solid var(--light);
  border-radius: var(--radius-sm); max-height: 180px; overflow-y: auto;
  z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.editore-dropdown.open { display: block; }
.editore-opt {
  padding: 11px 14px; font-size: 0.88rem; cursor: pointer;
  border-bottom: 1px solid var(--light); transition: background 0.1s;
}
.editore-opt:last-child { border-bottom: none; }
.editore-opt:hover, .editore-opt.highlighted { background: var(--off); }
.editore-new { color: var(--blue); font-style: italic; }

.lettore-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.lettore-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--light); background: var(--white); font-size: 0.9rem; font-weight: 600; color: var(--mid); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
.lettore-btn.active { background: var(--ink); border-color: var(--ink); color: var(--white); }
.card-actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.btn-x { padding: 15px 18px; border-radius: var(--radius-sm); border: none; background: var(--light); cursor: pointer; font-size: 1rem; }

/* SETTINGS */
#settings-view { display: none; padding-top: 4px; }
.section-title { font-family: 'Instrument Serif', serif; font-size: 1.3rem; font-weight: 400; margin: 16px 0 12px; }
.setting-block { background: var(--off); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; }
.setting-block h4 { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid); margin-bottom: 12px; }
.tags-row { display: flex; gap: 8px; }
.tags-row input { flex: 1; padding: 11px 14px; border: 1.5px solid var(--light); border-radius: var(--radius-sm); font-family: 'Geist', monospace; font-size: 0.88rem; background: var(--white); color: var(--ink); outline: none; }
.tags-row input:focus { border-color: var(--ink); }
.cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--light); }
.cat-row:last-child { border-bottom: none; padding-bottom: 0; }
.cat-row-name { font-size: 0.88rem; font-weight: 500; }
.cat-row-id { font-size: 0.68rem; color: var(--mid); font-family: monospace; }

/* NAV */
#bottom-nav { flex-shrink: 0; border-top: 1px solid var(--light); padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--white); }
.nav-inner { display: flex; background: var(--off); border-radius: 100px; padding: 4px; gap: 4px; }
.nav-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: none; border-radius: 100px; background: transparent; font-family: 'Geist', sans-serif; font-size: 0.8rem; font-weight: 500; color: var(--mid); cursor: pointer; transition: all 0.2s; }
.nav-btn.active { background: var(--white); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<div id="root">
  <div id="topbar">
    <div class="wordmark">
      <h1>Scan Libri</h1>
      <span class="badge">ISBN → Sheets</span>
    </div>
  </div>

  <!-- AUTH -->
  <div id="auth-wrap">
    <div class="auth-hero">
      <span class="big-icon">📚</span>
      <h2>La tua libreria digitale</h2>
      <p>Scansiona i codici ISBN e salva i libri nei tuoi Google Sheet.</p>
    </div>
    <button class="btn btn-primary" onclick="signIn()">🔑 Accedi con Google</button>
  </div>

  <!-- APP -->
  <div id="app-root">
    <div id="status-bar"></div>
    <div id="scroll-area">

      <!-- SCANNER VIEW -->
      <div id="scanner-view">
        <div id="reader"></div>
        <div class="scan-actions">
          <button class="btn btn-primary" id="scan-btn" onclick="toggleScanner()">▶ Scansiona</button>
          <button class="btn btn-ghost" onclick="toggleManual()">✏️ Manuale</button>
        </div>
        <div class="manual-row" id="manual-area">
          <input class="isbn-input" type="text" id="manual-isbn" placeholder="978-..." maxlength="17"
            onkeydown="if(event.key==='Enter') lookupISBN(this.value)">
          <button class="btn btn-primary btn-sm" style="flex-shrink:0;width:auto;"
            onclick="lookupISBN(document.getElementById('manual-isbn').value)">Cerca</button>
        </div>

        <!-- SUGGESTION -->
        <div id="suggestion-banner">
          <div class="suggestion-label">📍 Destinazione suggerita</div>
          <div class="suggestion-dest" id="suggestion-dest"></div>
          <div class="suggestion-actions">
            <button class="sug-btn sug-confirm" onclick="confirmSuggestion()">✓ Confermo</button>
            <button class="sug-btn sug-change" onclick="changeSuggestion()">Cambia</button>
          </div>
        </div>

        <!-- DEST PICKER -->
        <div id="dest-picker">
          <div class="dest-title">Dove va questo libro?</div>
          <div class="dest-grid" id="dest-grid"></div>
          <div id="tab-picker">
            <div class="tab-picker-label" style="margin-top:12px;">Sezione</div>
            <div class="tab-btns" id="tab-btns"></div>
          </div>
        </div>

        <!-- BOOK CARD -->
        <div id="book-card">
          <div class="book-card-title">Dati del libro</div>
          <div class="field"><label>Titolo</label><input type="text" id="f-titolo" placeholder="Titolo"></div>
          <div class="field-row">
            <div class="field"><label>Nome</label><input type="text" id="f-nome" placeholder="Nome"></div>
            <div class="field"><label>Cognome</label><input type="text" id="f-cognome" placeholder="Cognome"></div>
          </div>

          <!-- EDITORE con autocomplete -->
          <div class="field">
            <label>Editore</label>
            <div class="editore-wrap">
              <input class="editore-search" type="text" id="f-editore" placeholder="Cerca editore…"
                autocomplete="off"
                oninput="filterEditori(this.value)"
                onfocus="filterEditori(this.value)"
                onblur="setTimeout(closeDropdown, 200)">
              <div class="editore-dropdown" id="editore-dropdown"></div>
            </div>
          </div>

          <div class="field"><label>Lettore</label><div class="lettore-row" id="lettore-row"></div></div>
          <div class="card-actions">
            <button class="btn btn-primary" onclick="saveBook()">💾 Salva nel foglio</button>
            <button class="btn-x" onclick="resetAll()">✕</button>
          </div>
        </div>
      </div>

      <!-- SETTINGS VIEW -->
      <div id="settings-view">
        <div class="section-title">Impostazioni</div>
        <div class="setting-block">
          <h4>Lettori</h4>
          <div class="tags-row">
            <input type="text" id="tags-input" placeholder="N, F, A, B">
            <button class="btn btn-ghost btn-sm" style="flex-shrink:0;width:auto;" onclick="saveTags()">Salva</button>
          </div>
        </div>
        <div class="setting-block">
          <h4>Categorie collegate</h4>
          <div id="cat-list"></div>
        </div>
        <button class="btn btn-danger" onclick="signOut()" style="margin-top:4px;">Esci dall'account</button>
      </div>

    </div><!-- scroll-area -->

    <div id="bottom-nav">
      <div class="nav-inner">
        <button class="nav-btn active" id="nav-scan" onclick="showView('scan')"><span>📷</span> Scansiona</button>
        <button class="nav-btn" id="nav-settings" onclick="showView('settings')"><span>⚙️</span> Impostazioni</button>
      </div>
    </div>
  </div>
</div>

<script>
const CATEGORIES = [
  { name: '01 Narrativa',        sheetId: '19SXHAYn7ETE1uGVuJXH14SiiJ7QMx1MOmej2F5_0ExE', tabs: ['ITALIANA','STRANIERA'], editoriSheet: true },
  { name: '02 Saggi',            sheetId: '1GsqPrCb-lyGEP-GKEi4lrcDLj7KdNjQTs0ADOaNBJU8', tabs: null, editoriSheet: false },
  { name: 'Architettura/Design', sheetId: '1titzEKFrx6XE35i12XrPWiIISZla30QaH0a4NwOnuS4', tabs: null, editoriSheet: false },
  { name: 'Arte',                sheetId: '1xAr_9-_Vuq4rS2K4K6xO7V2D34eqBLDUrRRadyDr5Ow', tabs: null, editoriSheet: false },
  { name: 'Cinema/Fotografia',   sheetId: '1cjVHErs-lXLqMXOrfOu3PIAXeA8CUbWM4YvxawF9XkU', tabs: null, editoriSheet: false },
  { name: 'Escursionistica',     sheetId: '1Rh6QC5Y4_fX9pV53wzcT3Vc8c2WPBJG-c4cF34LijyM', tabs: null, editoriSheet: false },
  { name: 'Friuli',              sheetId: '1fyhewJRc6BX2MZSVIAG4MjE1-D0dia2oqJDdraozcDc', tabs: null, editoriSheet: false },
  { name: 'Illustrazione',       sheetId: '1ViQgJaZo5Hl9wyPUKRXNJ8W2KDZ4ljlZdJlsB66dFPQ', tabs: null, editoriSheet: false },
  { name: 'Saggi Naturalistici', sheetId: '15Kt0lndSmmxum33_zY-OZnMfBh3cOTesAIKHqByy-v0', tabs: null, editoriSheet: false },
];

const NARRATIVA_SHEET_ID = '19SXHAYn7ETE1uGVuJXH14SiiJ7QMx1MOmej2F5_0ExE';

const GENRE_MAP = {
  'fiction':0,'novel':0,'literary':0,'narrative':0,'romanzo':0,'narrativa':0,'poetry':0,'drama':0,'short stories':0,
  'history':1,'philosophy':1,'psychology':1,'sociology':1,'politics':1,'economics':1,'science':1,'biography':1,'autobiography':1,'essay':1,
  'architecture':2,'design':2,'interior':2,
  'art':3,'painting':3,'sculpture':3,
  'photography':4,'film':4,'cinema':4,'movie':4,
  'travel':5,'hiking':5,'nature':5,'outdoor':5,'mountain':5,
  'illustration':7,'comic':7,'graphic novel':7,
  'natural history':8,'ecology':8,'botany':8,'zoology':8,'environment':8,
};

const CLIENT_ID = '601610748136-ng08e20fs8re2qavfgknbdupvl0q8ni1.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets';

let accessToken = null;
let tags = ['N','F'], currentTag = '';
let scannerRunning = false, html5Scanner = null;
let tabsCache = {};
let editoriList = []; // loaded from Editori sheet
let currentBook = null, selectedCatIdx = null, selectedTab = null;

// ── AUTH ──────────────────────────────────────────────
function signIn() {
  const p = new URLSearchParams({ client_id: CLIENT_ID, redirect_uri: location.href.split('?')[0].split('#')[0], response_type: 'token', scope: SCOPES, prompt: 'consent' });
  location.href = 'https://accounts.google.com/o/oauth2/auth?' + p;
}
function signOut() {
  accessToken = null; localStorage.removeItem('sl_token');
  document.getElementById('auth-wrap').style.display = 'flex';
  document.getElementById('app-root').style.display = 'none';
}
function checkAuth() {
  const h = new URLSearchParams(location.hash.substring(1));
  if (h.get('access_token')) { accessToken = h.get('access_token'); localStorage.setItem('sl_token', accessToken); history.replaceState({}, '', location.pathname); }
  else accessToken = localStorage.getItem('sl_token');
  if (accessToken) showApp();
}
async function showApp() {
  document.getElementById('auth-wrap').style.display = 'none';
  document.getElementById('app-root').style.display = 'flex';
  loadTags(); renderLettore(); renderCatList();
  await loadEditori();
}

// ── EDITORI ───────────────────────────────────────────
async function loadEditori() {
  try {
    const range = encodeURIComponent('Editori!A2:A');
    const r = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${NARRATIVA_SHEET_ID}/values/${range}`,
      { headers: { Authorization: 'Bearer ' + accessToken } }
    );
    if (r.status === 401) { signOut(); return; }
    const d = await r.json();
    editoriList = (d.values || []).map(row => row[0]).filter(Boolean).sort();
  } catch(e) {
    editoriList = [];
  }
}

function filterEditori(query) {
  const dropdown = document.getElementById('editore-dropdown');
  const q = query.trim().toLowerCase();
  const matches = q
    ? editoriList.filter(e => e.toLowerCase().includes(q))
    : editoriList.slice(0, 30);

  let html = matches.map(e =>
    `<div class="editore-opt" onmousedown="selectEditore('${e.replace(/'/g, "\\'")}')">${e}</div>`
  ).join('');

  // If typed text doesn't exactly match any editor, offer to use it as-is
  if (q && !editoriList.some(e => e.toLowerCase() === q)) {
    html += `<div class="editore-opt editore-new" onmousedown="selectEditore('${query.replace(/'/g, "\\'")}')")>Usa "${query}"</div>`;
  }

  dropdown.innerHTML = html;
  dropdown.classList.toggle('open', html.length > 0);
}

function selectEditore(val) {
  document.getElementById('f-editore').value = val;
  closeDropdown();
}

function closeDropdown() {
  document.getElementById('editore-dropdown').classList.remove('open');
}

// ── TABS ──────────────────────────────────────────────
async function loadTabsForCat(i) {
  const cat = CATEGORIES[i];
  if (cat.tabs) { tabsCache[cat.sheetId] = cat.tabs; return; }
  if (tabsCache[cat.sheetId]) return;
  try {
    const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${cat.sheetId}?fields=sheets.properties.title`, { headers: { Authorization: 'Bearer '+accessToken } });
    if (r.status===401) { signOut(); return; }
    const d = await r.json();
    tabsCache[cat.sheetId] = d.sheets.map(s=>s.properties.title).filter(t=>t!=='Editori');
  } catch(e) {}
}
function getTabsFor(i) { return tabsCache[CATEGORIES[i].sheetId] || null; }

// ── VIEWS ─────────────────────────────────────────────
function showView(view) {
  document.getElementById('scanner-view').style.display = view==='scan' ? 'block' : 'none';
  document.getElementById('settings-view').style.display = view==='settings' ? 'block' : 'none';
  document.getElementById('nav-scan').classList.toggle('active', view==='scan');
  document.getElementById('nav-settings').classList.toggle('active', view==='settings');
  if (view !== 'scan' && scannerRunning) stopScanner();
}

// ── SCANNER ───────────────────────────────────────────
async function toggleScanner() {
  if (scannerRunning) stopScanner(); else await startScanner();
}
async function startScanner() {
  if (!html5Scanner) html5Scanner = new Html5Qrcode('reader');
  try {
    await html5Scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 280, height: 120 },
        aspectRatio: 1.5,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.CODE_128,
        ]
      },
      (code) => { if (code && code.length >= 10) { stopScanner(); lookupISBN(code); } },
      () => {}
    );
    scannerRunning = true;
    document.getElementById('scan-btn').textContent = '⏹ Ferma';
  } catch(e) { showStatus('Errore fotocamera: ' + e, 'error'); }
}
async function stopScanner() {
  if (html5Scanner && scannerRunning) { try { await html5Scanner.stop(); } catch(e) {} }
  scannerRunning = false;
  document.getElementById('scan-btn').textContent = '▶ Scansiona';
}
function toggleManual() {
  const a = document.getElementById('manual-area');
  a.classList.toggle('visible');
  if (a.classList.contains('visible')) document.getElementById('manual-isbn').focus();
}

// ── ISBN LOOKUP ───────────────────────────────────────
async function lookupISBN(isbn) {
  isbn = (isbn||'').replace(/[-\s]/g,'');
  if (isbn.length < 10) { showStatus('ISBN non valido', 'error'); return; }
  showStatus('Ricerca in corso…', 'loading');
  resetBookUI();

  let bookData = null;

  try {
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`);
    const d = await r.json();
    if (d.totalItems > 0) {
      const info = d.items[0].volumeInfo;
      const {nome,cognome} = splitAuthor((info.authors||[''])[0]);
      bookData = { nome, cognome, titolo: info.title||'', editore: info.publisher||'', language: info.language||'', categories: info.categories||[] };
    }
  } catch(e) {}

  if (!bookData) {
    try {
      const r = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
      const d = await r.json();
      const b = d[`ISBN:${isbn}`];
      if (b) {
        const {nome,cognome} = splitAuthor((b.authors||[])[0]?.name||'');
        bookData = { nome, cognome, titolo: b.title||'', editore: (b.publishers||[])[0]?.name||'', language:'', categories:[] };
      }
    } catch(e) {}
  }

  if (!bookData) {
    showStatus('Libro non trovato — compila manualmente.', 'error');
    bookData = { nome:'', cognome:'', titolo:'', editore:'', language:'', categories:[] };
  } else {
    showStatus('', '');
  }

  currentBook = bookData;

  // Try to match editore from our list
  const matchedEditore = matchEditore(bookData.editore);
  fillForm(bookData.nome, bookData.cognome, bookData.titolo, matchedEditore || bookData.editore);

  const suggested = suggestCategory(bookData);
  await loadTabsForCat(suggested);
  showSuggestion(suggested, bookData);
}

// Match editore from Google Books to our list (fuzzy)
function matchEditore(raw) {
  if (!raw || editoriList.length === 0) return raw;
  const r = raw.toLowerCase();
  // Exact match
  let match = editoriList.find(e => e.toLowerCase() === r);
  if (match) return match;
  // Contains match
  match = editoriList.find(e => r.includes(e.toLowerCase()) || e.toLowerCase().includes(r));
  return match || raw;
}

// ── SUGGESTION ────────────────────────────────────────
function suggestCategory(book) {
  const allText = book.categories.join(' ').toLowerCase();
  for (const [kw, idx] of Object.entries(GENRE_MAP)) {
    if (allText.includes(kw)) return idx;
  }
  return 0;
}

function showSuggestion(catIdx, book) {
  selectedCatIdx = catIdx;
  const cat = CATEGORIES[catIdx];
  const tabs = getTabsFor(catIdx);
  if (catIdx === 0 && tabs) {
    selectedTab = (book.language === 'it') ? 'ITALIANA' : 'STRANIERA';
  } else {
    selectedTab = tabs ? tabs[0] : null;
  }
  const tabLabel = selectedTab ? ` › ${selectedTab}` : '';
  document.getElementById('suggestion-dest').textContent = cat.name + tabLabel;
  document.getElementById('suggestion-banner').classList.add('visible');
}

function confirmSuggestion() {
  document.getElementById('suggestion-banner').classList.remove('visible');
  document.getElementById('dest-picker').classList.remove('visible');
}
function changeSuggestion() {
  document.getElementById('suggestion-banner').classList.remove('visible');
  showDestPicker();
}
function showDestPicker() {
  document.getElementById('dest-picker').classList.add('visible');
  document.getElementById('dest-grid').innerHTML = CATEGORIES.map((c,i) =>
    `<button class="dest-btn ${i===selectedCatIdx?'active':''}" onclick="selectDest(${i}, this)">${c.name}</button>`
  ).join('');
  renderTabPicker(selectedCatIdx);
}
async function selectDest(i, el) {
  selectedCatIdx = i;
  document.querySelectorAll('.dest-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  await loadTabsForCat(i);
  renderTabPicker(i);
}
function renderTabPicker(catIdx) {
  const tabs = getTabsFor(catIdx);
  const picker = document.getElementById('tab-picker');
  if (!tabs || tabs.length <= 1) { picker.classList.remove('visible'); selectedTab = tabs?tabs[0]:null; return; }
  picker.classList.add('visible');
  if (!selectedTab || !tabs.includes(selectedTab)) selectedTab = tabs[0];
  document.getElementById('tab-btns').innerHTML = tabs.map(t =>
    `<button class="tab-btn ${t===selectedTab?'active':''}" onclick="selectTabBtn('${t}',this)">${t}</button>`
  ).join('');
}
function selectTabBtn(t, el) {
  selectedTab = t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

// ── FORM ──────────────────────────────────────────────
function fillForm(nome, cognome, titolo, editore) {
  document.getElementById('f-nome').value = nome;
  document.getElementById('f-cognome').value = cognome;
  document.getElementById('f-titolo').value = titolo;
  document.getElementById('f-editore').value = editore;
  document.getElementById('book-card').style.display = 'block';
}
function resetBookUI() {
  document.getElementById('suggestion-banner').classList.remove('visible');
  document.getElementById('dest-picker').classList.remove('visible');
  document.getElementById('book-card').style.display = 'none';
  document.querySelectorAll('.lettore-btn').forEach(b=>b.classList.remove('active'));
  closeDropdown();
  currentTag=''; currentBook=null; selectedCatIdx=null; selectedTab=null;
}
function resetAll() {
  resetBookUI(); showStatus('','');
  document.getElementById('manual-isbn').value = '';
}
function splitAuthor(s) {
  s = (s||'').trim();
  if (!s) return {nome:'',cognome:''};
  if (s.includes(',')) { const [c,n]=s.split(',').map(x=>x.trim()); return {nome:n||'',cognome:c}; }
  const p = s.split(' ');
  return {cognome:p[p.length-1], nome:p.slice(0,-1).join(' ')};
}

// ── LETTORE ───────────────────────────────────────────
function selectLettore(el, val) {
  document.querySelectorAll('.lettore-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); currentTag=val;
}
function renderLettore() {
  document.getElementById('lettore-row').innerHTML =
    tags.map(t=>`<button class="lettore-btn" onclick="selectLettore(this,'${t}')">${t}</button>`).join('') +
    `<button class="lettore-btn" onclick="selectLettore(this,'')">—</button>`;
}
function loadTags() {
  const s = localStorage.getItem('sl_tags');
  if (s) tags = JSON.parse(s);
  const inp = document.getElementById('tags-input');
  if (inp) inp.value = tags.join(', ');
}
function saveTags() {
  tags = document.getElementById('tags-input').value.split(',').map(t=>t.trim()).filter(Boolean);
  localStorage.setItem('sl_tags', JSON.stringify(tags));
  renderLettore(); showStatus('Lettori aggiornati!','success');
}

// ── SAVE ──────────────────────────────────────────────
async function saveBook() {
  if (selectedCatIdx === null) { showStatus('Scegli una destinazione', 'error'); return; }
  const cat = CATEGORIES[selectedCatIdx];
  const tabs = getTabsFor(selectedCatIdx);
  const tab = selectedTab || (tabs?tabs[0]:'Foglio1');
  const nome    = document.getElementById('f-nome').value.trim();
  const cognome = document.getElementById('f-cognome').value.trim();
  const titolo  = document.getElementById('f-titolo').value.trim();
  const editore = document.getElementById('f-editore').value.trim();
  const autore  = [nome,cognome].filter(Boolean).join(' ');
  if (!titolo) { showStatus('Il titolo è obbligatorio', 'error'); return; }
  showStatus('Salvataggio…','loading');
  try {
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${cat.sheetId}/values/${encodeURIComponent(tab+'!A:F')}:append?valueInputOption=USER_ENTERED`,
      { method:'POST', headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}, body:JSON.stringify({values:[[autore,nome,cognome,titolo,editore,currentTag]]}) }
    );
    if (res.status===401) { signOut(); return; }
    if (!res.ok) { const e=await res.json(); showStatus('Errore: '+(e.error?.message||res.status),'error'); return; }
    showStatus(`✓ "${titolo}" → ${cat.name}${tab?' › '+tab:''}`, 'success');
    resetAll();
  } catch(e) { showStatus('Errore di rete: '+e.message,'error'); }
}

// ── STATUS ────────────────────────────────────────────
function showStatus(msg, type) {
  const bar = document.getElementById('status-bar');
  bar.className = type||'';
  bar.style.display = (type&&msg)?'block':'none';
  if (type==='loading') { bar.innerHTML=`<div class="spinner"></div> ${msg}`; bar.style.display='flex'; }
  else bar.textContent = msg;
}
function renderCatList() {
  document.getElementById('cat-list').innerHTML = CATEGORIES.map(c=>
    `<div class="cat-row"><span class="cat-row-name">${c.name}</span><span class="cat-row-id">${c.sheetId.substring(0,12)}…</span></div>`
  ).join('');
}

checkAuth();
</script>
